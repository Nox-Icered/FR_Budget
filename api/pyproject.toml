[project]
name = "fr-budget-api"
version = "0.0.0"
description = "API sans état du simulateur public du budget des administrations publiques françaises"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "fr-budget",
    "uvicorn",
]

[tool.uv.sources]
fr-budget = { path = "../moteur", editable = true }

[dependency-groups]
dev = [
    "httpx",
    "mypy",
    "pytest",
    "ruff",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fr_budget_api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "C4", "RUF", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["openfisca_core.*", "openfisca_france.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
