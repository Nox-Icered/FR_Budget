  - id: credits_missions_ecart_execution
    libelle: Écart entre les dépenses constatées et les crédits votés d'une mission du budget général
    unite: écart relatif aux crédits votés en loi de finances initiale
    valeur_centrale: 0.0
    plage:
      basse: -0.147
      haute: 0.09
    sources: [dgfip_plrg_2023, dgfip_plrg_2024, dgfip_plrg_2025]
    justification: >-
      Le rendement d'une variation des crédits d'une mission est la part correspondante de ses
      crédits de paiement demandés au PLF 2026 (valeur centrale : aucun écart). La plage reprend
      les 10e et 90e centiles de l'écart relatif entre dépenses constatées et crédits votés en
      LFI, par mission du levier, pour les exercices 2023, 2024 et 2025 (86 observations ;
      annexe 1 des PLRG). Calcul : fr_budget.agrege.credits_missions.plage_ecart_execution(),
      arrondi au millième. Les écarts mêlent sous-exécution, reports, fonds de concours et
      ouvertures ou annulations en cours d'année.
    instruments: [credits_missions]

  - id: dotations_elasticite_investissement_communes
    libelle: Élasticité de court terme de l'investissement des communes aux dotations de l'État
    unite: variation relative de l'investissement pour une variation relative de 1 des dotations
    valeur_centrale: 0.14
    plage:
      basse: 0.1
      haute: 0.4
    sources: [cdc_eclairages_8_dotations_investissement]
    justification: >-
