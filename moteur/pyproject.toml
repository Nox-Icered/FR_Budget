[project]
name = "fr-budget"
version = "0.0.0"
description = "Moteur de calcul du simulateur public du budget des administrations publiques françaises"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openfisca-france==176.1.2",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "ruff",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fr_budget"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "N", "SIM", "C4", "RUF",
    "PLR2004",  # pas de nombre magique : toute constante vient du registre
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "validation: test qui compare le modèle à un chiffrage de référence officiel ou académique",
]
addopts = "--strict-markers"

[[tool.mypy.overrides]]
# OpenFisca ne publie pas d'annotations de types.
module = ["openfisca_core.*", "openfisca_france.*"]
ignore_missing_imports = true
