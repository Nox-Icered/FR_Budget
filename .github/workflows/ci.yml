name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  donnees-interdites:
    name: Micro-données d'enquête interdites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 outils/verifier_donnees_interdites.py

  moteur:
    name: Moteur (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: moteur
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - name: Registres (schémas, renvois, empreintes, libellés)
        run: uv run python -m fr_budget.registres.verification
      - name: Tests unitaires
        run: uv run pytest -m "not validation"

  api:
    name: API (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest

  site:
    name: Site (types, tests, construction)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Données exportées par l'API
        run: pnpm donnees
      - run: pnpm test
      - run: pnpm build
      - name: Navigateur du contrôle d'accessibilité
        run: pnpm exec playwright-core install --with-deps chromium
      - name: Contrôle d'accessibilité (axe-core, WCAG 2.1 AA)
        run: pnpm accessibilite

  validation:
    name: Tests de validation (écarts aux références)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: moteur
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      # Non bloquant (décision du mainteneur du 8 octobre 2026) : les écarts hors tolérance
      # sont publiés, pas cachés ; ils ne bloquent pas la fusion.
      - name: Tests de validation
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          uv run pytest -m validation -rA | tee "$RUNNER_TEMP/validation.log"
      - name: Tableau des écarts (résumé de l'exécution)
        if: always()
        run: |
          uv run python -m fr_budget.validation >> "$GITHUB_STEP_SUMMARY"
          # Le tableau ne couvre que les comparaisons chiffrées ; la liste ci-dessous reprend
          # tous les tests de validation en échec, y compris les contrôles des comptes et de
          # l'Urssaf.
          {
            echo "## Tests de validation en échec (liste complète de pytest)"
            echo
            if grep -qE '^(FAILED|ERROR) ' "$RUNNER_TEMP/validation.log"; then
              grep -E '^(FAILED|ERROR) ' "$RUNNER_TEMP/validation.log" | sed 's/^/- /'
            else
              echo "Aucun."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Signaler les écarts hors tolérance
        if: steps.tests.outcome == 'failure'
        run: echo "::warning title=Validation::Des écarts aux références dépassent la tolérance ; voir le résumé de l'exécution et la page Validation."

  references-urssaf:
    name: Références Urssaf reproductibles
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: outils/references_urssaf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run generer
      - name: Le fichier de référence committé est celui que produit le script
        run: git diff --exit-code -- ../../registres/references/menages/
