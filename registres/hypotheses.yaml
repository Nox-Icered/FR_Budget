# Registre des hypothèses (identifiant, libellé, valeur centrale, plage, sources,
# justification, instruments concernés).

hypotheses:
  - id: tva_repartition_produits_mixtes_stable
    libelle: Répartition par taux des produits relevant de plusieurs taux de TVA, stable d'une année à l'autre
    unite: écart relatif de la part au taux réduit par rapport à l'année de référence (2023)
    valeur_centrale: 0.0
    plage:
      basse: -0.004
      haute: 0.004
    sources: [plf2025_voies_et_moyens_tome2]
    justification: >-
      Les parts par taux des travaux de construction spécialisés sont calculées à partir des
      dépenses fiscales 730213 et 730223 de 2023 (tome II du PLF 2025, pages 165 et 167), puis
      appliquées aux comptes de 2015, 2022 et 2024. La part de l'assiette au taux de 5,5 %
      vaut 0,2373 avec les montants de 2023 (2 150 et 970 M€), 0,2366 avec ceux de 2024
      (2 170 et 975 M€) et 0,2375 avec ceux de 2025 (2 280 et 1 030 M€) : la plage couvre
      l'écart maximal observé (0,32 %), arrondi à 0,4 %. Elle ne couvre pas les années antérieures au taux de
      5,5 % sur la rénovation énergétique (2014).
    instruments: [tva]

  - id: tva_ecart_territorial_stable
    libelle: Écart de TVA dû aux taux particuliers d'outre-mer et de Corse, au niveau de 2023 pour toutes les années
    unite: écart relatif par rapport au montant de 2023
    valeur_centrale: 0.0
    plage:
      basse: -0.062
      haute: 0.062
    sources: [plf2025_voies_et_moyens_tome2]
    justification: >-
      Le modèle applique les taux de la France métropolitaine à toute la consommation. Les
      dépenses fiscales 710103, 710105 et 730306 (tome II du PLF 2025, pages 159 et 172)
      mesurent l'écart dû aux taux d'outre-mer et de Corse : 2 297 M€ en 2023 (réalisation),
      2 308 M€ en 2024 et 2 439 M€ en 2025 (prévisions). Le montant de 2023 est retranché de la
      recette théorique de chaque année ; la plage reprend l'écart maximal observé entre ces
      trois années (6,2 %), dans les deux sens.
    instruments: [tva]

  - id: dette_part_refinancement_debut_annee
    libelle: Part du refinancement de l'année réalisée dès le 1er janvier plutôt qu'au fil de l'année
    unite: fraction du refinancement annuel
    valeur_centrale: 0.0
    plage:
      basse: 0.0
      haute: 1.0
    sources: [plf2027_pap_engagements_financiers_etat]
    justification: >-
      Le programme d'émission (340 Md€ en 2027, page 32) est réalisé au fil de l'année : la
      valeur centrale suppose un refinancement continu, dont le surcoût d'un choc de taux est la
      moyenne exacte sur l'année (décision du mainteneur du 8 octobre 2026). Les titres à court
      terme renouvelés tôt dans l'année et les émissions concentrées en début d'année
      rapprochent le calendrier d'un refinancement au 1er janvier (borne haute). Aucune source
      publiée ne donne le calendrier des émissions : la plage est large.
    instruments: [dynamique_dette]

  - id: baseline_part_refinancee
    libelle: Part de la dette publique refinancée chaque année au taux de marché, de 2031 à 2046
    unite: fraction de la dette de début d'année
    valeur_centrale: 0.194
    plage:
      basse: 0.193
      haute: 0.194
    sources: [plf2027_pap_engagements_financiers_etat]
    justification: >-
      Part de la dette négociable de l'État refinancée en 2027 (émissions à moyen et long terme
      de 340,0 Md€, titres courts de 205,5 Md€ et leur variation de 2,2 Md€, rapportés à un
      encours de 2 822,4 Md€) : 19,4 %. Le même calcul pour 2026 donne 19,3 %. La plage couvre
      ces deux millésimes. Elle est étroite et ne couvre ni le profil de maturité des autres
      sous-secteurs (sécurité sociale, collectivités), ni un allongement ou un raccourcissement
      futur de la maturité.
    instruments: [baseline]

  - id: baseline_ajustement_stock_flux
    libelle: Ajustement stock-flux annuel de 2031 à 2046
    unite: points de PIB par an
    valeur_centrale: 0.0
    plage:
      basse: 0.0
      haute: 0.5
    sources: [plf2027_resf]
    justification: >-
      Le RESF 2027 publie des flux de créances de 0,1 point de PIB en 2025 et de 0,5 point en
      2026 et 2027 (annexe finances publiques, tableau 14). Pour 2028-2030, l'écart qui referme
      la formule de la dette vaut 0,02, -0,06 et -0,06 point (taux apparent reconstitué en
      euros, correction du 28 octobre 2026 ; avant : 0,10, 0,03 et 0,04). La valeur centrale suppose
      qu'aucun flux de créances ne s'ajoute au déficit après 2030 ; la borne haute reprend le
      niveau de 2026-2027.
    instruments: [baseline]

  - id: baseline_cout_vieillissement_variantes
    libelle: Variation du coût du vieillissement après 2030 selon les variantes de l'Ageing Report 2024
    unite: écart en 2046 à la variation 2030-2046 du scénario de référence, points de PIB
    valeur_centrale: 0.0
    plage:
      basse: -0.358
      haute: 0.948
    sources: [ce_ageing_report_2024]
    justification: >-
      Le scénario de référence de l'Ageing Report 2024 donne un coût total du vieillissement
      (retraites, santé, dépendance, éducation) presque stable de 2030 à 2046 (+0,002 point).
      Les huit variantes publiées pour la France (annexe statistique, onglet FRc) changent
      cette variation de -0,358 point (fécondité plus basse de 20 %) à +0,948 point (scénario
      de risque sur la santé et la dépendance) en 2046. Le modèle applique chaque variante
      année par année ; la plage indique les extrêmes en 2046.
    instruments: [baseline]

  - id: baseline_croissance_volume
    libelle: Croissance du PIB en volume de 2031 à 2046
    unite: "% par an (valeur centrale et borne basse : Ageing Report en 2031, la série varie ensuite ; borne haute maintenue sur toute la période)"
    valeur_centrale: 0.609
    plage:
      basse: 0.609
      haute: 1.0
    sources: [ce_ageing_report_2024, plf2027_resf]
    justification: >-
      Valeur centrale : croissance potentielle de l'Ageing Report 2024, année par année (0,609 %
      en 2031, 1,511 % en 2040, 1,399 % en 2046 ; onglet FRa). Variante : croissance potentielle
      du RESF 2027 pour 2030 (1,0 %, tableau 21), maintenue de 2031 à 2046 (décision du
      mainteneur du 9 octobre 2026, option (i)). L'Ageing Report ne publie pas la croissance
      du PIB de ses variantes. La variante relève la croissance tant que la série de l'Ageing
      Report reste sous 1,0 % et l'abaisse ensuite.
    instruments: [baseline]

  - id: baseline_taux_marche
    libelle: Taux d'intérêt de marché auquel la dette est refinancée de 2031 à 2046
    unite: "% (valeur centrale et borne basse : Ageing Report en 2031, la série varie ensuite ; borne haute maintenue sur toute la période)"
    valeur_centrale: 3.609
    plage:
      basse: 3.609
      haute: 4.3
    sources: [ce_ageing_report_2024, plf2027_resf]
    justification: >-
      Valeur centrale : taux d'intérêt nominal de l'Ageing Report 2024, année par année (3,609 %
      en 2031, 3,912 % en 2046 ; onglet FRa). Variante : taux obligataire à 10 ans prévu par le
      RESF 2027 pour 2027 (4,3 %, annexe macroéconomique, tableau 8), maintenu de 2031 à 2046
      (décision du mainteneur du 9 octobre 2026, option (i)).
    instruments: [baseline]

  - id: scenario_rendement_constant_pib
    libelle: Rendement d'une mesure constant en points de PIB après son entrée en vigueur
    unite: écart relatif au rendement de l'année de référence rapporté au PIB
    valeur_centrale: 0.0
    plage:
      basse: 0.0
      haute: 0.0
    sources: [insee_comptes_nationaux_2025]
    justification: >-
      Le rendement d'une mesure est chiffré pour 2025 (en Md€), rapporté au PIB de 2025
      (INSEE, comptes nationaux, édition 2025 : 2 991,1 Md€), puis tenu constant en points de
      PIB : il croît comme le PIB en valeur. C'est la convention de la baseline, exprimée en
      points de PIB. Aucune source ne fournit encore l'élasticité de chaque recette au PIB : la
      plage est nulle et cette limite est affichée. Une plage sourcée remplacera cette
      convention quand l'élasticité sera saisie.
    instruments: [tva, accises_energie, impot_societes]

  - id: accises_masses_volumiques
    libelle: Masses volumiques servant à convertir en litres les ventes de carburants publiées en tonnes
    unite: écart relatif aux masses volumiques de la Base Carbone (gazole 832, essences 747, fioul domestique 845 kg/m³)
    valeur_centrale: 0.0
    plage:
      basse: -0.016
      haute: 0.016
    sources: [ademe_base_carbone_pci_masse_volumique, sdes_conso_produits_petroliers]
    justification: >-
      Le SDES publie les ventes en tonnes ; les tarifs d'accise sont exprimés par hectolitre. La
      Base Carbone de l'ADEME donne 832 kg/m³ pour le gazole, 747 kg/m³ pour l'essence et
      845 kg/m³ pour le fioul domestique ; aucune valeur n'y figure pour le superéthanol E85,
      converti avec celle de l'essence. La plage reprend l'écart entre les deux valeurs que la
      même table donne pour des gazoles (832 et 845 kg/m³, soit 1,6 %), appliqué à tous les
      produits.
    instruments: [accises_energie]

  - id: accises_gpl_part_carburant
    libelle: Part des ventes de GPL taxée au tarif carburant plutôt qu'au tarif combustible
    unite: fraction des ventes de GPL
    valeur_centrale: 0.0
    plage:
      basse: 0.0
      haute: 1.0
    sources: [sdes_conso_produits_petroliers, openfisca_france_176_1_2]
    justification: >-
      Les ventes de GPL du SDES regroupent butane, propane et GPL carburant, taxés à 6,63 €
      (combustible) ou 20,71 € (carburant) par 100 kg. Aucune source saisie ne donne la
      répartition : la valeur centrale applique le tarif combustible, la plage couvre tout le
      spectre (0,10 à 0,33 Md€ en 2024, environ 0,7 % de la recette).
    instruments: [accises_energie]

  - id: accises_tarif_moyen_gnr_2024
    libelle: Tarif moyen d'accise appliqué en 2024 aux ventes de gazole non routier
    unite: €/hl
    valeur_centrale: 24.81
    plage:
      basse: 18.82
      haute: 24.81
    sources: [ministere_guide_fiscalite_energies_2026]
    justification: >-
      En 2024, le gazole non routier à usage non agricole est taxé à 24,81 €/hl ; l'usage agricole
      bénéficie d'un remboursement puis, à partir du 1er juillet 2024, d'un tarif réduit à
      l'achat (guide 2026, pages 23 et 25). Les ventes du SDES ne séparent pas les deux usages.
      Valeur centrale : tarif non agricole sur tout le volume, comme en 2023 où tout le gazole
      non routier était taxé à 18,82 €/hl avant remboursement ; borne basse : tarif de 2023.
    instruments: [accises_energie]

  - id: depenses_fiscales_ecart_depense
    libelle: Écart entre le coût réalisé et le coût prévu d'une dépense fiscale
    unite: écart relatif au coût prévu
    valeur_centrale: 0.0
    plage:
      basse: -0.362
      haute: 0.575
    sources: [plf2024_voies_et_moyens_tome2, plf2026_voies_et_moyens_tome2]
    justification: >-
      Le rendement de la réduction d'une dépense fiscale est la part correspondante de son coût
      prévu pour 2026 par le PLF 2026 (valeur centrale : aucun écart). La plage reprend les 10e
      et 90e centiles de l'écart relatif entre le coût prévu pour 2024 par le PLF 2024 (prévision
      à un an, comme celle de 2026 dans le PLF 2026) et le coût réalisé publié par le PLF 2026,
      sur les 274 dépenses chiffrées dans les deux tomes avec une prévision positive. Calcul :
      fr_budget.agrege.depenses_fiscales.plage_ecart_par_depense(2024, 2026, 2024), arrondi au
      millième. Les écarts mêlent erreurs de prévision et changements de méthode de chiffrage.
    instruments: [depenses_fiscales]

  - id: depenses_fiscales_ecart_impot_revenu
    libelle: Écart entre le coût réalisé et le coût prévu des dépenses fiscales (impôt sur le revenu)
    unite: écart relatif au coût prévu
    valeur_centrale: 0.0
    plage:
      basse: 0
      haute: 0.062
    sources: [plf2024_voies_et_moyens_tome2, plf2025_voies_et_moyens_tome2, plf2026_voies_et_moyens_tome2]
    justification: >-
      Le rendement de la réduction des dépenses fiscales d'un impôt est la part correspondante
      de leur coût prévu pour 2026 par le PLF 2026 (valeur centrale : aucun écart). La plage va
      de zéro à l'écart extrême constaté entre le coût total prévu et le coût réalisé publié
      deux ans plus tard, sur trois comparaisons : prévision 2023 du PLF 2024 et réalisation du
      PLF 2025 ; prévision 2024 du PLF 2025 et réalisation du PLF 2026 ; prévision 2024 du PLF
      2024 et réalisation du PLF 2026. Périmètre : dépenses présentes dans les deux tomes et
      chiffrées lors de la prévision ; convention du tome II pour les dépenses non chiffrées.
      Calcul : fr_budget.agrege.depenses_fiscales.ecart_par_impot, arrondi au millième.
    instruments: [depenses_fiscales]

