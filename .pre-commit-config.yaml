# Installation : uv tool install pre-commit && pre-commit install
# Les hooks utilisent les versions verrouillées dans moteur/uv.lock.
repos:
  - repo: local
    hooks:
      - id: donnees-interdites
        name: micro-données d'enquête interdites
        entry: python3 outils/verifier_donnees_interdites.py
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-check
        name: ruff (lint)
        entry: uv run --directory moteur ruff check
        language: system
        pass_filenames: false
        files: ^moteur/
      - id: ruff-format
        name: ruff (format)
        entry: uv run --directory moteur ruff format --check
        language: system
        pass_filenames: false
        files: ^moteur/
      - id: mypy
        name: mypy (strict)
        entry: uv run --directory moteur mypy
        language: system
        pass_filenames: false
        files: ^moteur/
      - id: registres
        name: registres (schémas, renvois, empreintes, libellés)
        entry: uv run --directory moteur python -m fr_budget.registres.verification
        language: system
        pass_filenames: false
        files: ^(registres/|data/raw/|docs/fiches/|moteur/src/fr_budget/registres/)
