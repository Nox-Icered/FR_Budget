# Registre des leviers paramétriques de la V1 (docs/specification.md, « Leviers
# paramétriques V1 »). Aucun levier n'est publié tant qu'il n'a pas passé la règle de
# publication (CLAUDE.md) : statut valide, beta ou non_publie.

leviers:
  - id: tva
    libelle: TVA
    parametres_reglables: [Taux normal, Taux réduits, Taux super-réduit]
    moteur: agrege
    references_visees: [Évaluations de rendement dans Voies et Moyens (PLF)]
    statut: beta

  - id: impot_revenu
    libelle: Impôt sur le revenu
    parametres_reglables: [Tranches, Taux, Plafond du quotient familial, Décote]
    moteur: openfisca_et_agrege
    references_visees: [Voies et Moyens, TAXIPP (IPP)]
    statut: non_publie

  - id: impot_societes
    libelle: Impôt sur les sociétés
    parametres_reglables: [Taux normal, Taux PME, Seuils]
    moteur: agrege
    references_visees: [Voies et Moyens, Rapports du Conseil des prélèvements obligatoires]
    statut: beta

  - id: csg
    libelle: CSG
    parametres_reglables: [Taux sur les revenus d'activité, Taux plein sur les pensions de retraite, Taux sur les revenus du capital]
    moteur: openfisca_et_agrege
    references_visees: [Rapports à la Commission des comptes de la sécurité sociale (2018 et 2026), rapport du Sénat sur le PLFSS 2026, Cour des comptes]
    statut: beta

  - id: cotisations_patronales
    libelle: Cotisations patronales
    parametres_reglables: [Taux de cotisation patronale déplafonnée du secteur privé, Montant des allègements généraux]
    moteur: agrege
    references_visees: [Rapports à la Commission des comptes de la sécurité sociale (2018, 2024 à 2026), Cour des comptes]
    statut: beta

  - id: accises_energie
    libelle: Accises et taxes sur l'énergie
    parametres_reglables: [Taux sur les carburants, Taux sur le tabac, Taux sur l'alcool]
    moteur: agrege
    references_visees: [Voies et Moyens]
    statut: beta

  - id: depenses_fiscales
    libelle: Dépenses fiscales (niches fiscales)
    parametres_reglables: [Réduction de 0 à 100 % d'une dépense fiscale du catalogue, Réduction de 0 à 100 % des dépenses fiscales d'un impôt]
    moteur: agrege
    references_visees: [Voies et Moyens, tome 2 (coût des dépenses fiscales)]
    statut: beta

  - id: credits_missions
    libelle: Crédits par mission du budget de l'État
    parametres_reglables: [Variation en pourcentage des crédits de paiement d'une mission du budget général]
    moteur: agrege
    references_visees: [Annexes budgétaires du PLF, PLRG (dépenses constatées)]
    statut: beta

  - id: remunerations_publiques
    libelle: Rémunérations publiques
    parametres_reglables: [Variation de la valeur du point d'indice, Variation des effectifs des trois fonctions publiques]
    moteur: agrege
    references_visees: [Annexe « Rémunérations de la fonction publique », Cour des comptes]
    statut: beta

  - id: indexation_pensions_prestations
    libelle: Revalorisation des pensions et prestations
    parametres_reglables: [Écart à la revalorisation légale des pensions de base et des prestations, en points]
    moteur: agrege
    references_visees: [PLFSS 2026 et 2027 (chiffrages des gels et sous-indexations), rapport du Sénat sur le PLFSS 2026, Cour des comptes]
    statut: beta

  - id: minima_prime_activite
    libelle: Minima sociaux et prime d'activité
    parametres_reglables: [Montants, Barèmes]
    moteur: openfisca
    references_visees: [DREES, CNAF]
    statut: non_publie

  - id: dotations_collectivites
    libelle: Dotations de l'État aux collectivités
    parametres_reglables: [Variation de la DGF, Variation des compensations d'exonérations et de réformes fiscales]
    moteur: agrege
    references_visees: [Annexe « Transferts financiers de l'État aux collectivités », DGCL]
    statut: beta
