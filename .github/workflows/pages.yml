name: Publication (GitHub Pages)

# Publie le site statique après chaque CI réussie sur main (et seulement alors), à l'adresse
# https://nox-icered.github.io/FR_Budget/ (préfixe des adresses : NEXT_PUBLIC_BASE_PATH, voir
# web/lib/chemin.ts). Le service de calcul de « Mon ménage » n'est pas hébergé :
# NEXT_PUBLIC_API_URL reste vide et la page l'indique.
# Réglage du dépôt nécessaire une fois : Settings → Pages → Source : « GitHub Actions ».

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Droits minimaux ; l'écriture sur Pages et le jeton OIDC sont réservés au job de publication,
# qui n'exécute aucun code du dépôt ni de dépendance.
permissions:
  contents: read

# Une seule publication à la fois ; une publication en cours n'est pas interrompue.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construction:
    name: Construction du site
    # Lancement manuel, ou CI terminée avec succès (CI en échec ou annulée : pas de publication).
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          # Le commit vérifié par la CI, pas un commit plus récent de main.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Données exportées par l'API
        run: pnpm donnees
      # Tests sans préfixe, comme en CI : ils vérifient les adresses d'un site à la racine.
      - run: pnpm test
      - name: Construction avec le préfixe de GitHub Pages
        run: pnpm build
        env:
          NEXT_PUBLIC_BASE_PATH: /FR_Budget
          NEXT_PUBLIC_API_URL: ""
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  publication:
    name: Publication
    needs: construction
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publication.outputs.page_url }}
    steps:
      - id: publication
        uses: actions/deploy-pages@v4
