# Corrections appliquées à OpenFisca-France par le projet, en attendant leur prise en
# compte en amont. Chaque correction cite ses sources et la version d'OpenFisca visée.
# Une montée de version d'OpenFisca impose de vérifier si la correction est encore utile.
#
# Les sources sont des identifiants de registres/sources.yaml. Les sources primaires
# (Légifrance, BOFiP, site de l'AGS) n'étaient pas joignables le 7 octobre 2026 : elles
# sont citées d'après des résultats de recherche (acces: recherche_web) et recoupées avec
# le modèle de calcul de l'Urssaf. À confirmer sur les textes primaires.

openfisca_france_version: "176.1.2"

corrections:
  - id: taux_ags_2024_07
    type: parametre
    parametre: prelevements_sociaux.cotisations_regime_assurance_chomage.ags.employeur.ags
    tranche: 0
    date_effet: "2024-07-01"
    valeur: 0.0025
    libelle: Taux de la cotisation AGS employeur porté à 0,25 % au 1er juillet 2024
    constat: >
      OpenFisca 176.1.2 retient 0,20 % depuis le 1er janvier 2024 (dernière vérification
      notée dans le paramètre : 14 mars 2024).
    sources:
      - ags_communique_taux_2024_07
      - legisocial_ags_2024_07
      - modele_social_11_1_0

  - id: mutuelle_part_patronale_imposable
    type: variable
    # complementaire_sante_employeur est négatif dans OpenFisca (cotisation) : on le
    # retranche du salaire imposable pour l'y ajouter, puis on l'ajoute au salaire net,
    # qu'OpenFisca calcule à partir du salaire imposable, pour l'en retirer.
    terme: complementaire_sante_employeur
    ajouter:
      salaire_imposable: -1
      salaire_net: 1
    date_effet: "2013-01-01"
    libelle: >
      La part patronale de la complémentaire santé collective obligatoire est ajoutée au
      salaire imposable
    constat: >
      OpenFisca 176.1.2 déduit la part salariale (complementaire_sante_salarie) du salaire
      imposable mais n'y ajoute pas la part patronale (complementaire_sante_employeur).
    sources:
      - bofip_prevoyance_complementaire
      - ag2r_sort_fiscal_contributions
      - modele_social_11_1_0

  - id: apprenti_cotisations_salariales
    type: formule
    date_effet: "2024-01-01"
    valeurs:
      date_nouveau_regime: "2025-03-01"
      part_smic_cotisations_avant: 0.79
      part_smic_cotisations_depuis: 0.50
    libelle: >
      Exonération des cotisations salariales de l'apprenti limitée à la part du salaire
      inférieure à 79 % du SMIC (contrat conclu avant le 1er mars 2025) ou à 50 % du SMIC
      (contrat conclu depuis)
    constat: >
      OpenFisca 176.1.2 exonère l'apprenti de toutes ses cotisations salariales, sans plafond
      (variable exoneration_cotisations_salariales_apprenti). Correction appliquée à partir de
      2024, années calculées par le projet ; elle approche l'exonération par la part du
      salaire sous le plafond, exacte sous le plafond de la Sécurité sociale.
    sources:
      - service_public_f2918
      - modele_social_11_1_0

  - id: apprenti_csg_crds
    type: formule
    date_effet: "2024-01-01"
    valeurs:
      date_nouveau_regime: "2025-03-01"
      part_smic_csg_crds_depuis: 0.50
    libelle: >
      Salaire de l'apprenti exonéré de CSG et de CRDS : en totalité pour un contrat conclu
      avant le 1er mars 2025, dans la limite de 50 % du SMIC pour un contrat conclu depuis
    constat: >
      OpenFisca 176.1.2 soumet tout le salaire de l'apprenti à la CSG et à la CRDS. La
      correction porte sur les deux assiettes de la CSG (assiette_csg_abattue,
      assiette_csg_non_abattue), qui servent aussi à la CRDS.
    sources:
      - service_public_f2918
      - modele_social_11_1_0

  - id: apprenti_impot_revenu
    type: formule
    date_effet: "2024-01-01"
    libelle: >
      Salaire de l'apprenti exonéré d'impôt sur le revenu dans la limite du SMIC, appliquée
      mois par mois
    constat: >
      OpenFisca 176.1.2 compte tout le salaire de l'apprenti dans le revenu imposable : le
      paramètre impot_revenu.calcul_revenus_imposables.exo_ir.conditions_ressources_exoneration_ir
      existe mais aucune formule ne l'utilise. La limite est le « montant annuel du Smic »
      (service-public.gouv.fr) ; comme le modèle de l'Urssaf, la correction l'applique mois
      par mois (SMIC mensuel brut), ce qui revient au même pour un salaire régulier.
    sources:
      - service_public_f2918
      - modele_social_11_1_0
