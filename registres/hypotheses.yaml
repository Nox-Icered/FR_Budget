  - id: retraites_duree_montee_en_charge
    libelle: Durée de montée en charge du relèvement d'un an de l'âge effectif moyen de départ
    unite: années
    valeur_centrale: 4.0
    plage:
      basse: 4.0
      haute: 4.9
    sources: [cor_rapport_annuel_2026]
    justification: >-
      La réforme de 2023 a reporté l'âge d'ouverture des droits « à raison de trois mois par
      génération » (rapport du COR de juin 2026, page 206) : un an de relèvement prend quatre
      générations, soit quatre ans (valeur centrale). Pour rester linéaire dans la valeur du
      levier (calcul du site), la même durée est appliquée quel que soit l'écart choisi : un
      relèvement de trois ans monte donc trois fois plus vite qu'à ce rythme. L'âge effectif
      suit l'âge légal avec retard et partiellement : après la réforme de 2010, l'âge
      conjoncturel de départ observé passe de 60,49 ans en 2010 à 62,12 ans en 2017 (4,3 ans
      par an d'âge effectif) et à 62,31 ans en 2019 (4,9 ans par an) (COR, rapport de juin
      2026, figure 2.5, page 78 du PDF, et ses données, onglet « Fig 2.5 »). Plage de 4 à 4,9
      ans, appliquée le 28 octobre 2026 à la demande du mainteneur
      (docs/validation/plages_nulles.md, § 3) ; la hausse observée mêle d'autres causes
      (durée d'assurance, départs anticipés). Le modèle par cohortes (âge légal) n'utilise que
      la valeur centrale : c'est le rythme légal de trois mois par génération, sans
      incertitude.
    instruments: [retraites]

  - id: menages_ecart_evolution_salaire_smic
    libelle: Écart entre l'évolution des salaires médian et du 95e centile et celle du SMIC net, de 2024 à l'année simulée
    unite: écart relatif
    valeur_centrale: 0.0
    plage:
      basse: 0.0
      haute: 0.0
    sources: [insee_premiere_2079]
    justification: >-
      Les salaires de l'Insee portent sur 2024 ; les ménages types sont simulés sur les revenus
      de 2025. Les niveaux médian et du 95e centile sont portés en 2025 en gardant leur
      rapport au SMIC net. En 2024, l'Insee constate une hausse du pouvoir d'achat proche dans
      tout le haut de la distribution (+0,8 % pour la médiane, +0,5 % pour le 95e centile,
      page 2, figure 3), sans donnée sur 2025 : l'écart est pris nul, sans plage.
    instruments: [menages_types]

  - id: menages_ecart_evolution_pension_moyenne
    libelle: Écart entre l'évolution de la pension moyenne de droit direct et la revalorisation des pensions de base, de fin 2023 à l'année simulée
    unite: écart relatif
    valeur_centrale: 0.0
    plage:
      basse: 0.0
      haute: 0.0
    sources: [drees_retraites_2025_fiche05, dss_instruction_2023_189, dss_instruction_2024_176]
    justification: >-
      La pension moyenne de la DREES porte sur fin 2023 ; le ménage type est simulé sur 2025.
      Elle est revalorisée comme les pensions de base (coefficients de 1,053 et 1,022). Les
      pensions complémentaires suivent d'autres règles, et la pension moyenne évolue aussi avec
      le renouvellement des générations (la DREES décrit les deux effets) ; sans chiffrage pour
      2024 et 2025, l'écart est pris nul, sans plage.
    instruments: [menages_types]

  - id: menages_ecart_evolution_revenu_independant
    libelle: Écart entre l'évolution du revenu médian des non-salariés et celle du SMIC horaire brut, de 2023 à l'année simulée
    unite: écart relatif
    valeur_centrale: 0.0
    plage:
      basse: 0.0
      haute: 0.0
    sources: [insee_premiere_2060]
    justification: >-
      Le revenu médian de l'Insee porte sur 2023 ; le ménage type est simulé sur 2025. Il est
      porté en 2025 en gardant son rapport au SMIC horaire brut. L'Insee constate en 2023 une
      baisse du revenu moyen des non-salariés classiques en euros constants (-4,4 %), sans
      donnée sur 2024 et 2025 : l'écart est pris nul, sans plage.
    instruments: [menages_types]

  - id: retraites_part_departs_non_decales
    libelle: Part des départs à la retraite qui ne sont pas décalés par un relèvement de l'âge légal (ex-invalidité, handicap, inaptitude au travail)
    unite: fraction
    valeur_centrale: 0.151
    plage:
      basse: 0.058
      haute: 0.151
    sources: [drees_retraites_2025_donnees]
    justification: >-
      DREES, fiche 17, graphique 2 (génération 1956, régimes de base) : départs pour
      ex-invalidité ou handicap et pour inaptitude au travail, qui gardaient l'âge de 62 ans dans
      la réforme de 2023. Valeur centrale : régime général (7,8 % + 7,3 %), le premier régime ;
      borne basse : fonction publique de l'État (5,8 % + 0 %), la plus faible des cinq régimes
      publiés. Les autres types de départ (carrière longue, durée, décote, surcote) sont supposés
      décalés du même écart.
    instruments: [retraites]

  - id: retraites_part_emploi_avant_liquidation
    libelle: Part en emploi, l'année précédant la liquidation, des personnes dont le départ est décalé
    unite: fraction
    valeur_centrale: 0.6772
    plage:
      basse: 0.5585
      haute: 0.7997
    sources: [drees_retraites_2025_donnees]
    justification: >-
      DREES, fiche 20, tableau 1 (génération 1950) : situation principale l'année précédant la
      liquidation. Valeur centrale : ensemble de la génération (67,72 %) ; bornes : départs à
      60 ans (55,85 %) et départs entre 61 et 64 ans (79,97 %). Les autres (chômage, maladie ou
      invalidité, sans activité) ne versent pas de prélèvements supplémentaires dans le modèle,
      et leurs prestations supplémentaires ne sont pas comptées.
    instruments: [retraites]

  - id: retraites_ecart_pension_liquidants
    libelle: Écart entre la pension de droit direct des nouveaux retraités et celle de l'ensemble des retraités
    unite: fraction
    valeur_centrale: -0.048
    plage:
      basse: -0.065
      haute: -0.048
    sources: [drees_retraites_2025_donnees]
    justification: >-
      DREES, fiche 7, tableau 1 (fin 2023), colonne « Écart entre la pension des liquidants et
      celle de l'ensemble des retraités » : -4,8 % pour les primo-liquidants de tous régimes,
      -6,5 % pour ceux qui résident en France. La pension économisée par un départ décalé est
      la pension moyenne de l'année multipliée par 1 + écart.
    instruments: [retraites]
