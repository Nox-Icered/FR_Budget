name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  donnees-interdites:
    name: Micro-données d'enquête interdites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 outils/verifier_donnees_interdites.py

  moteur:
    name: Moteur (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: moteur
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - name: Tests unitaires
        run: uv run pytest -m "not validation"
      - name: Tests de validation
        # Aucun test de validation pour l'instant : pytest renvoie 5 quand rien n'est collecté.
        run: uv run pytest -m validation || [ $? -eq 5 ]
