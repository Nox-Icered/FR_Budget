name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  donnees-interdites:
    name: Micro-données d'enquête interdites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 outils/verifier_donnees_interdites.py

  moteur:
    name: Moteur (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: moteur
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - name: Registres (schémas, renvois, empreintes, libellés)
        run: uv run python -m fr_budget.registres.verification
      - name: Tests unitaires
        run: uv run pytest -m "not validation"

  api:
    name: API (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest

  site:
    name: Site (types, tests, construction)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Données exportées par l'API
        run: pnpm donnees
      - run: pnpm test
      - run: pnpm build

  validation:
    name: Tests de validation (écarts aux références)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: moteur
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest -m validation -rA

  references-urssaf:
    name: Références Urssaf reproductibles
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: outils/references_urssaf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run generer
      - name: Le fichier de référence committé est celui que produit le script
        run: git diff --exit-code -- ../../registres/references/menages/
